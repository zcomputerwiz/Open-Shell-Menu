name: StartMenu Abstraction Tests

on:
  push:
    paths:
      - 'Src/StartMenu/**'
      - 'tests/startmenu/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/startmenu-tests.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  abstraction-layer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 python3 wine64

      - name: Build abstraction layer and tests
        run: |
          mkdir -p tests/startmenu/results
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -I Src/StartMenu/Abstraction \
            -I Src/StartMenu/Abstraction/StubImplementations \
            -I tests/startmenu \
            Src/StartMenu/Abstraction/StubImplementations/StubShellIntegration.cpp \
            tests/startmenu/StartMenuBehaviorTests.cpp \
            -o tests/startmenu/StartMenuBehaviorTests.exe

      - name: Check contract coverage
        run: |
          python3 tests/startmenu/check_coverage.py \
            docs/startmenu_behavior_contract.md \
            tests/startmenu/StartMenuBehaviorTests.cpp

      - name: Run tests under Wine
        run: |
          wine64 tests/startmenu/StartMenuBehaviorTests.exe | tee tests/startmenu/results/linux_wine_test_output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: tests/startmenu/results/

  full-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.vcxproj') }}

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet Packages
        run: nuget restore "${{ github.workspace }}\Src\OpenShell.sln"

      - name: Build full solution
        run: msbuild Src/OpenShell.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Build abstraction test binary (MSVC)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            /I Src\StartMenu\Abstraction ^
            /I Src\StartMenu\Abstraction\StubImplementations ^
            /I tests\startmenu ^
            Src\StartMenu\Abstraction\StubImplementations\StubShellIntegration.cpp ^
            tests\startmenu\StartMenuBehaviorTests.cpp ^
            /Fe:tests\startmenu\StartMenuBehaviorTests.exe

      - name: Run abstraction tests
        run: tests/startmenu/StartMenuBehaviorTests.exe

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-binary
          path: tests/startmenu/StartMenuBehaviorTests.exe

  wine-integration:
    runs-on: ubuntu-latest
    needs: full-build-windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine
        run: sudo apt-get update && sudo apt-get install -y wine64

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: windows-test-binary

      - name: Run tests under Wine with debug logging
        run: |
          WINEDEBUG=warn+all,fixme+all wine64 StartMenuBehaviorTests.exe 2>wine_debug.log || true
          echo "Wine integration execution completed" >> wine_debug.log

      - name: Upload Wine debug log
        uses: actions/upload-artifact@v4
        with:
          name: wine-debug-log
          path: wine_debug.log

      - name: Generate Wine compatibility summary
        run: |
          echo "## Wine Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "### FIXME/STUB calls encountered:" >> $GITHUB_STEP_SUMMARY
          grep -oP 'FIXME:\K[^\n]+' wine_debug.log | sort | uniq -c | sort -rn >> $GITHUB_STEP_SUMMARY || echo "None" >> $GITHUB_STEP_SUMMARY

