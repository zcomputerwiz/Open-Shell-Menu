name: StartMenu Abstraction Tests

on:
  push:
    paths:
      - 'Src/StartMenu/**'
      - 'tests/startmenu/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/startmenu-tests.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  abstraction-layer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 python3 wine64

      - name: Build abstraction layer and tests
        run: |
          mkdir -p tests/startmenu/results
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Werror \
            -I Src/StartMenu/Abstraction \
            -I Src/StartMenu/Abstraction/StubImplementations \
            -I tests/startmenu \
            Src/StartMenu/Abstraction/StubImplementations/StubShellIntegration.cpp \
            tests/startmenu/StartMenuBehaviorTests.cpp \
            -o tests/startmenu/StartMenuBehaviorTests.exe

      - name: Check contract coverage
        run: |
          python3 tests/startmenu/check_coverage.py \
            docs/startmenu_behavior_contract.md \
            tests/startmenu/StartMenuBehaviorTests.cpp

      - name: Run tests under Wine
        run: |
          if command -v wine64 >/dev/null 2>&1; then
            WINE_BIN=wine64
          elif command -v wine >/dev/null 2>&1; then
            WINE_BIN=wine
          else
            echo "Neither wine64 nor wine is available on PATH" >&2
            exit 1
          fi
          "$WINE_BIN" tests/startmenu/StartMenuBehaviorTests.exe | tee tests/startmenu/results/linux_wine_test_output.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: tests/startmenu/results/

  full-build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2

      - name: Setup WiX Toolset (v3.14)
        shell: pwsh
        run: |
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14"
          $binPath = Join-Path $wixPath "bin"

          if (-not (Test-Path $binPath)) {
            choco install wixtoolset --version 3.14.1 --force -y
          }

          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Add-Content -Path $env:GITHUB_ENV -Value "WIX=$wixPath"

      - name: Install HTML Help Workshop
        shell: pwsh
        run: |
          choco install html-help-workshop -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\HTML Help Workshop"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet Packages
        run: nuget restore "${{ github.workspace }}\Src\OpenShell.sln"

      - name: Run Open-Shell Build Script
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\Src\Setup\__MakeFinal.bat"

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build abstraction test binary (MSVC)
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX ^
            /I Src\StartMenu\Abstraction ^
            /I Src\StartMenu\Abstraction\StubImplementations ^
            /I tests\startmenu ^
            Src\StartMenu\Abstraction\StubImplementations\StubShellIntegration.cpp ^
            tests\startmenu\StartMenuBehaviorTests.cpp ^
            /Fe:tests\startmenu\StartMenuBehaviorTests.exe

      - name: Run abstraction tests
        run: tests/startmenu/StartMenuBehaviorTests.exe

      - name: Upload full build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-build-artifacts
          path: |
            Src/Setup/Final/*.exe
            Src/Setup/Final/*.msi
            Src/Setup/Final/*.zip

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-binary
          path: tests/startmenu/StartMenuBehaviorTests.exe

  wine-integration:
    runs-on: ubuntu-latest
    needs: full-build-windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine
        run: sudo apt-get update && sudo apt-get install -y wine64

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: windows-test-binary

      - name: Run tests under Wine with debug logging
        run: |
          if command -v wine64 >/dev/null 2>&1; then
            WINE_BIN=wine64
          elif command -v wine >/dev/null 2>&1; then
            WINE_BIN=wine
          else
            echo "Neither wine64 nor wine is available on PATH" > wine_debug.log
            exit 0
          fi
          WINEDEBUG=warn+all,fixme+all "$WINE_BIN" StartMenuBehaviorTests.exe 2>wine_debug.log || true
          echo "Wine integration execution completed" >> wine_debug.log

      - name: Upload Wine debug log
        uses: actions/upload-artifact@v4
        with:
          name: wine-debug-log
          path: wine_debug.log

      - name: Generate Wine compatibility summary
        run: |
          echo "## Wine Compatibility Report" >> $GITHUB_STEP_SUMMARY
          echo "### FIXME/STUB calls encountered:" >> $GITHUB_STEP_SUMMARY
          grep -oP 'FIXME:\K[^\n]+' wine_debug.log | sort | uniq -c | sort -rn >> $GITHUB_STEP_SUMMARY || echo "None" >> $GITHUB_STEP_SUMMARY

# [CODEX] Last modified by: Codex
# [CODEX] Phase: 4
# [CODEX] Summary: Hardened Wine invocation to support runners exposing wine (not only wine64) and kept Windows __MakeFinal/MSVC flow.
